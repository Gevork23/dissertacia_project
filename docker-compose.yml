services:
  db:
    image: postgres:16-alpine
    container_name: dissertacia_db
    env_file:
      - infra/.env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 15

  qdrant:
    image: qdrant/qdrant:latest
    container_name: dissertacia_qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: dissertacia_backend
    env_file:
      - infra/.env
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings
      - DJANGO_LOG_LEVEL=INFO
    volumes:
      - ./backend:/app
      - media:/app/media
      - logs:/app/logs
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      qdrant:
        condition: service_started
    command: >
      sh -c "
      python manage.py migrate &&
      python manage.py runserver 0.0.0.0:8000
      "

volumes:
  postgres_data:
  qdrant_data:
  media:
  logs: