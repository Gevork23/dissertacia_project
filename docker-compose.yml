services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - infra/.env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 15

  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file:
      - infra/.env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings
      DJANGO_LOG_LEVEL: INFO
      STARTUP_WAIT_TIMEOUT_SECONDS: 60
    volumes:
      - ./backend:/app
      - media:/app/media
      - logs:/app/logs
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      qdrant:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8000/api/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
    command: sh /app/entrypoint.sh

volumes:
  postgres_data:
  qdrant_data:
  media:
  logs: